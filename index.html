<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASOP SNG Leaderboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e3a8a;
            color: #e0e7ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: url('poker_background.jpg'); /* Replace with your image path */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #leaderboard {
            width: 80%;
            max-width: 700px;
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            padding: 30px;
            border: 2px solid #60a5fa;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            color: #60a5fa;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        .description {
            font-size: 1.1em;
            margin-bottom: 20px;
            color: #c7d2fe;
            line-height: 1.5;
        }

        /* Tab Styling */
        .tab-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.1);
            color: #60a5fa;
            border: 1px solid #60a5fa;
            cursor: pointer;
            border-radius: 5px 5px 0 0; /* Rounded top corners */
            margin: 0 2px; /* Spacing between tabs */
        }

        .tab.active {
            background-color: rgba(96, 165, 250, 0.3);
            color: #fff;
        }

        /* Table Styling (Remains mostly the same) */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        th {
            background-color: rgba(0, 0, 0, 0.15);
            color: #60a5fa;
            font-weight: bold;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.25);
        }

        .top-rank {
            background-color: rgba(96, 165, 250, 0.3);
        }

        .rank-1 { color: #FFD700; font-weight: bold; }
        .rank-2 { color: #C0C0C0; font-weight: bold; }
        .rank-3 { color: #8c6a54; font-weight: bold; }

        td:first-child {
            text-align: center;
        }

        /* Hide tables by default */
        #score-table, #popularity-table {
            display: none;
        }

        #score-table.active-table, #popularity-table.active-table {
            display: table; /* Only show the active table */
        }
    </style>
</head>
<body>
    <div id="leaderboard">
        <h1>ASOP SNG 争霸榜</h1>
        <p class="description">
            第一名5分 第二名3分 第三名2分 </br>
            低买入比赛按奖金比例折扣积分 </br>
            总成绩为选手比赛成绩，抽奖分数用于选取玩家参加freeroll
        </p>

        <div class="tab-container">
            <div class="tab active" data-tab="score-table">总成绩</div>
            <div class="tab" data-tab="popularity-table">抽奖分数</div>
        </div>

        <table id="score-table" class="active-table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Name</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="score-table-body">
                </tbody>
        </table>

        <table id="popularity-table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Name</th>
                    <th>Votes</th>
                </tr>
            </thead>
            <tbody id="popularity-table-body">
                </tbody>
        </table>
    </div>

    <script>
        const scoreData = [
            { name: "Yue Du", score: 6 },
            { name: "Chang Luo", score: 7 },
            { name: "Chang Liu", score: 0 },
            { name: "Alan Wang", score: 0 },
            { name: "Jack Min", score: 7 },
            { name: "Alex Zhang", score: 5 },
            { name: "Daniel Meng", score: 5 },
            { name: "Jay Zhou", score: 0 },
            { name: "Bin Duan", score: 5 },
            { name: "Leo Zhu", score: 2 },
            { name: "Jade", score: 2 },
            { name: "Jun Yuan", score: 5 },
            { name: "Marvin", score: 3 },
            { name: "CHY", score: 0 },
            { name: "John Yu", score: 8 },
            { name: "Fred", score: 0 },
            { name: "Zhao", score: 0 },
            { name: "Tao", score: 0 },
            { name: "Xie", score: 0 },
            { name: "Benson", score: 3 },
            { name: "Nathan", score: 0 },
            { name: "Eva Huang", score: 0 },
            { name: "William Dai", score: 2 }
        ];

        // Sample popularity data (You'll need to populate this)
        const popularityData = [
            { name: "Yue Du", votes: 9 },
            { name: "Chang Luo", votes: 10 },
            { name: "Chang Liu", votes: 3 },
            { name: "Alan Wang", votes: 1 },
            { name: "Jack Min", votes: 17 },
             { name: "Alex Zhang", votes: 13 },
            { name: "Daniel Meng", votes: 18 },
            { name: "Jay Zhou", votes: 1 },
            { name: "Bin Duan", votes: 19 },
            { name: "Leo Zhu", votes: 9 },
            { name: "Jade", votes: 7 },
            { name: "Jun Yuan", votes: 8 },
            { name: "Marvin", votes: 8 },
            { name: "CHY", votes: 2 },
            { name: "John Yu", votes: 9 },
            { name: "Fred", votes: 6 },
            { name: "Zhao", votes: 3 },
            { name: "Tao", votes: 3 },
            { name: "Xie", votes: 2 },
            { name: "Benson", votes: 5 },
            { name: "Nathan", votes: 1 },
            { name: "Eva Huang", votes: 2 },
            { name: "William Dai", votes: 2 }
        ];

        scoreData.sort((a, b) => b.score - a.score);
        popularityData.sort((a,b) => b.votes - a.votes);

        const scoreTableBody = document.getElementById("score-table-body");
        const popularityTableBody = document.getElementById("popularity-table-body");

        function generateTableRows(data, tbody, scoreOrVotes) {
            tbody.innerHTML = "";
            for (let i = 0; i < data.length; i++) {
                const row = document.createElement("tr");
                const rankCell = document.createElement("td");
                const nameCell = document.createElement("td");
                const valueCell = document.createElement("td"); // Use a generic name

                rankCell.textContent = i + 1;
                nameCell.textContent = data[i].name;
                valueCell.textContent = data[i][scoreOrVotes]; // Access score or votes

                if (i < 10) {
                    row.classList.add("top-rank");
                    if(i === 0) rankCell.classList.add("rank-1");
                    if(i === 1) rankCell.classList.add("rank-2");
                    if(i === 2) rankCell.classList.add("rank-3");
                }

                row.appendChild(rankCell);
                row.appendChild(nameCell);
                row.appendChild(valueCell);
                tbody.appendChild(row);
            }
        }
        // Initial table generation
        generateTableRows(scoreData, scoreTableBody, "score");
        generateTableRows(popularityData, popularityTableBody, "votes");

        // Tab switching logic
        const tabs = document.querySelectorAll(".tab");
        tabs.forEach(tab => {
            tab.addEventListener("click", () => {
                // Remove active class from all tabs and tables
                tabs.forEach(t => t.classList.remove("active"));
                document.querySelectorAll("table").forEach(table => table.classList.remove("active-table"));

                // Add active class to the clicked tab
                tab.classList.add("active");

                // Show the corresponding table
                const tabId = tab.dataset.tab;
                document.getElementById(tabId).classList.add("active-table");
            });
        });

    </script>
</body>
</html>
